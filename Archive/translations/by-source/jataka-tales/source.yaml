notes: |
  The Jataka Tales are ancient Indian stories about the previous births of the Buddha,
  told as moral fables and parables. This collection, translated by Ellen C. Babbitt,
  includes 30+ individual tales. These stories have parallels in many cultures and
  include animal fables, moral lessons, and wisdom tales. Public domain.
