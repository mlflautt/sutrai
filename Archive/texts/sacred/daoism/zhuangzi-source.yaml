notes: |
  The original Chinese text of the Zhuangzi (莊子), attributed to Zhuangzi.
  This is the foundational text of Daoism alongside the Dao De Jing,
  consisting of 33 chapters in the standard Guo Xiang edition.
  Famous for its parables, stories, and philosophical anecdotes.
  The Inner Chapters (1-7) are generally considered the core text.
  From the Chinese Text Project (ctext.org).
