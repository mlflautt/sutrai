  middle: m withal, they who would go into war- wage. They bade the kings that one
    of them or the other, either Eystein or Sigurd, should fare and be captain of
    that folk which should betake itself to the journey. And the kings said yea thereto,
    and arrayed the journey at both their costs. To this journey betook themselves
    many mighty men, both landed-men and mighty bonders. And when the faring was boun,
    it was settled that Sigurd should fare, but Eystein should rule over the land
