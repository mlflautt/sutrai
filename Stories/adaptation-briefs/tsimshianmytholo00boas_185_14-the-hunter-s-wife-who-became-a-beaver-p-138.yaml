narrative_arc:
  beginning: 14. The Hunter's Wife who Became a Beaver (p. 138) A raccoon hunter is
    very successful. Wliile he is skinning the animals, his wife asks him to look
    at her. He becomes impatient and scolds her.
  middle: This makes her ashamed. She goes into the woods, dams up a river, and swims
    about in the water. The man calls her back, but she refuses to come. He requests
    his wife's brothers to induce her to
  end: come back, but they also are unsuccessful. She stays in the water, and finally
    becomes a beaver. The woman had red hair, therefore all beavers have red hair.
