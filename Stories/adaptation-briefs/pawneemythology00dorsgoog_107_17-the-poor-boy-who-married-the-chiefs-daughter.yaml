    but is ordered out by his daughter, although chief asks him to be seated and orders
    his daughter to cook for poor boy. She refuses, but offers to cook if he will
    provide water. Thereafter, boy often visits the chiefs tipi, though abused by
    chi
  middle: ef's daughter. Finally she beats him with stick and he goes upon hill and
