narrative_arc:
  beginning: 'THE STORY OF HARALD THE HARD-REDY. CHAPTER I. THE UPHEAVING OF KING
    HARALD THE HARD-REDY. HARALD, the son of Sigurd Sow, and brother to King Olaf
    the Holy by the same mother, was at Sticklestead in the battle whenas the holy
    King Olaf fell. There Harald was wounded and got away with the other fleeing men.
    So saith Thiodolf : Heard I that the keen shield-storm On the king anigh Howe
    drifted, The burner of the Bulgars, There well availed his brother. He, prince
    but of twelve winters And three ther...'
  middle: 'rode amongst certain wildwoods, Harald sang this : Now I but little honoured
    From wood to wood go creeping, And yet who wotteth, soothly, But at last I wax
    wide-famed. He fared east over lamtland and Helsingland, and so to Sweden, and
    there happened on Rognvald, son of Brusi, and on a great many others of those
    men of King Olaf as had gotten them from Sticklestead out of the battle. CHAPTER
    II. HARALD CAME INTO GARTHREALM. THE next spring they got them ships and went
    in the summer east into Gart...'
  end: 'as Eilif, son of Earl Rognvald. As Thiodolf says : Ill TheStory of Harald
    the Hard-redy. 59 Of one thing busied Were captains twain, Whereas sat Eilif :
    The wedge-host ranked they. Thrust were the East Wends Into the strait crook.
    Nought light unto Lesjars Was the law of the host-men. Harald tarried certain
    winters in Garthrealm and fared wide about the East-ways. Then he arrayed him
    to fare out into Greenland, and had mickle company of men ; and thence he went
    to Micklegarth. So saith Bolverk :...'
