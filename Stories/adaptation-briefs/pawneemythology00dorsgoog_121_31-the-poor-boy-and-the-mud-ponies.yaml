narrative_arc:
  beginning: 31. THE POOR BOY AND THE MUD PONIES. When dogs served as burden bearers
    instead of horses poor boy lives in village, to whom only chief shows friendship,
    for which chief is laughed at. Boy has vivid dream of two ponies, and thereafter
    often makes little mud ponies, and carries them in his robe and hid
  middle: es them outside village. He treats them as real, giving them drink and food.
    While sleeping in chief's lodge he again dreams of ponies and he hears Tirawa
    singing. In morning he goes to hill and repeats song, and some one visits him
    and tells him that Tirawa has given him dance, that he shall be chief
  end: ', and that his ponies will live. Obtaining lariat he goes to his mud ponies,
    which are now liv- ing animals. He leads them to village where people revere them,
    as they are first ever seen. Boy marries chief''s daughter, goes to war on one
    of his ponies, and returns victorious. He founds chief''s society.'
