    length, a is a more obscure sound. i = high-mixed open z; i = high-front open
    *; i itself is in Gaelic a high-front narrow, i.e. close sound. For basis cf.
    H. Sweet's Phonetics. d3 approximately like dg in English juo^e. tj (tch), the
    voiceless sound of preceding, pb is to indicate the peculiar quality of Gaelic
    initial b, which begins ...
  end: the ordinary script. In the later form of Mag (a plain) it passes into gh,
