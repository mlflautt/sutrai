    (although there are some words with the stress on the last ; and the negative
    prefix an often takes full stress). Cymric wy = ui; ftS = th in English //*en;
    11 (tt) = a broad buzzed 1, i.e. like the French 1 unvoiced, sounds like hi, and
    is unilateral (right side) with...'
  middle: ck (close) vowel a, which is the sound of u in Gaelic agws ; the a has the
