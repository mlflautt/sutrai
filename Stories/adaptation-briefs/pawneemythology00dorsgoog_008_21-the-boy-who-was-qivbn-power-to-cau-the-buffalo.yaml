  beginning: 21. THE BOY WHO WAS QIVBN POWER TO CAU THE BUFFALO. (See Abstracts.)
    [Told by Thief, a Kitkehahki. The interest in this tale is chiefly in the lesson
    whidi it is supposed to convey, viz, that the gods of the heavens watdi over the
    pregnant woman and protect the new-bom child from harm and
  middle: disease. The relating in the tale of the deeds of the young man who delivers
    his people from hunger, overcomes the enemy, and slays the monsters, furnishes
    of course the chanu:teristic features of a hero tale. The connection of this story
    with the bundle is through the fact that the north
  end: wind, who assisted him in his search for food, ultimatdy gave him a bundle,
    and it is believed that through the rites enacted during the performance of the
    bundle ceremony the gods are moved to render similar assistance. Two additional
    versions of the tale are presented in Nos. 99 and 93.1
