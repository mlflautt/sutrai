  beginning: THE IRISH ILIAD With Eber and Eremon, sons of Mile, and conquerors of
    the gods, begins a fresh series of characters in Gaelic tradition — the early
    " Milesian " kings of Ireland. Though monkish chroniclers have striven to find
    history in the legends handed down concerning them, they are none the less almost
    as mythical as the Tuatha De Danann. The first of them who has the least appearance
    of reality is Tigernmas, who is recorded to have reigned a hundred years after
    the coming of the Milesians....
