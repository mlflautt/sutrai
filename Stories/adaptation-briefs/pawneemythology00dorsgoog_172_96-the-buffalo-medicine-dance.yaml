narrative_arc:
  beginning: 96. THE BUFFALO MEDICINE DANCE. Boy meets old buffalo on hill who tells
    him that he is getting old. Buffalo takes pity on boy while boy feeds him. He
    hands boy little ball from his stomach, which, when he smells it, will enable
    him to see buffalo. He gives him whistle and some roots whic
  middle: h he is to use in doctoring. In buffalo dance he is to chew piece of ball,
    eat of root, and paint his face with mud from buffalo wallow and eat piece of
    it, whereupon he will have buffalo spirit and people will give him many presents.
    He gives him power to heal wounds, but not sickness.
  end: 'Boy returns and tells his father of his adventure; they return to buffalo,
    which is now dead. Then, as he has been directed by buffalo, he cuts off its tail
    and piece of scalp. In next medicine-lodge, boy dances buffalo dance, using robe,
    which changes its color. 53© THE pawnee: mythology.'
