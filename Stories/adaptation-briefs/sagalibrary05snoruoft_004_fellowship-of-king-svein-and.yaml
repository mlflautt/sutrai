  beginning: FELLOWSHIP OF KING SVEIN AND HARALD. A LITTLE later it was, that Harald
    and Svein spake on an evening over the drink, and Svein asked what precious things
    Harald had, whereby he set the greatest store. He answered that it was his banner,
    Landwaster. Then asked Svein what went with the banner that it was so mickle dear
    a thing. Harald said it was told of it, that he would have the victory before
    whom the banner was borne, and said that even so had it betided sithence he had
    got that. Svein answer...
  middle: 'hast so done before, as to hold to that only of thy covenants as seemed
