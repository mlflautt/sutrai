narrative_arc:
  beginning: 42. BURNT-BELLY AND HIS DREAMS. Apart from village Uve man and his sister.
    He is often visited by poor Burnt- Belly, who is always begging food. He addresses
    him as brother-in-law and tells his sister that Burnt-Belly is her future husband.
    Thus he made fun at his expense. Burnt-Belly goes to stream of water, where he
    has vision, in which he is addressed by finely costumed man, who tells him that
    he is to become great warrior. He tells hi
  middle: m that yoimg man's power comes from Sun, that this power is in his shield,
    and that Burnt-Belly is to ask for his shield. They follow war party and Burnt-Belly
    is told that he will be spoken to again. He does as directed. Joins war party
    in spite of protest, and takes scalp, which he gives to leader. Again he has dream
    on bank of river, where he is asked to fast for four days. Then he is told to
    dive into water four times and stand on ban
  end: k. He does so and finds himself beautifully costumed. On his way back he meets
    sister and excites her admiration. As she returns from river with water he asks
    for drink. She hesitates, and follows young man to her brother's lodge, where
    they spend night together. Brother-in-law is pleased that his sister is married.
    Shortly afterward boy repulses attack of enemy and soon leads successful war party.
    People wonder who he is and he tells them.
