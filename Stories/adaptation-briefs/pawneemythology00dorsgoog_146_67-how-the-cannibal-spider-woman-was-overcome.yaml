narrative_arc:
  beginning: 67. HOW THE CANNIBAL SPIDER-WOMAN WAS OVERCOME. Wonderful boy wearing
    his robe wrong side out sets out to find Spider- Woman's village, who kills people
    in tree-climbing contest. He is met by boy of her village, who takes him into
    his lodge and his mother warns him of Spider- Woman. He is invited to Spider-Woman's
    lodge by Eyes-Wide-Open, her errand man. He is offered human brains, but refuses
    to eat. In morning boy asks to be left alone in lodge. He smears his
  middle: body with white clay, spotting it with black, and ties feathers in his scalp-lock.
    He goes to contest and wagers his life against that of Spider- Woman and her children.
    Spider- Woman climbs tree, which falls, but she is not hurt. Boy prepares to climb,
    sings a song, and Eyes-Wide-Open asks to join his side, to which Spider- Woman
    assents. He throws robe aside, climbs tree, which falls, and he is unhurt. People
    run to Spider- Woman and kill her and her people, w
  end: ho are thrown into ravines over country. Eyes-Wide-Open is also killed. Boy
    declares there shall be no more cannibalism and caiises tree to fall. He tells
    woman in whose lodge he has stayed over night that she and her child thereafter
    shall live about old trees, and they become mice, while he and his people shall
    live in tops of trees, and he becomes speckled woodpecker. Thus it is that woodpeckers
    Uve in tops and mice among roots of hollow trees. ABSTRACTS. S05
