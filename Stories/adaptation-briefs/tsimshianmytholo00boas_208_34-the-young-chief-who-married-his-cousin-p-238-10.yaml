    Sk 221. Dza''wadalalis gives his son-in-law meat of the double-'
  middle: headed ser- pent. It looks like salmon. The youth hides it under his blanket.
    Next he gives him eggs of the double-headed serpent K 5.136. This incident occurs
    more frequently in connection with contests between a host and his visitor, or
    with visits to a country in which human eyes, snakes, or
  end: frogs are the regular food of the inhabitants. Visitors are offered human eyes
    H 5.239, 240; Hi 5.220. Tliese are the crabapples of the people Ri 5.218. Frogs
    and snakes are offered to visitors in Nu 5.120; fat of the double-headed serpent
    Co 5.88; dried meat of the double-headed serpent K 9.3.
