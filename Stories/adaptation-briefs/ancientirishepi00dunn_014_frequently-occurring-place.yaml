  beginning: 'FREQUENTLY OCCURRING PLACE AND PERSONAL-NAMES. It will simplify matters
    for the English reader if the following points respecting the pronunciation of
    proper names in medieval Irish, are borne in mind : Each simple word is accented
    on the first syllable. Pronounce : a (long), as in aught ; a (short), as in hot.
    c with slender vowels (e, i), as in king ; never as s. c with broad vowels (a,
    o, u), as in car ; never as s. ch with slender vowels (e, i), as in German Ich
    ; never as in chuYch. ch with...'
