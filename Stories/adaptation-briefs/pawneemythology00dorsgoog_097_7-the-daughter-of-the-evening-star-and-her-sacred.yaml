narrative_arc:
  beginning: 7. THE DAUGHTER OF THE EVENING-STAR AND HER SACRED BUNDLE. In sole earth-lodge
    beyond grass-lodge village in the west dwells beautiful girl, in attempting to
    marry whom many young men lose their lives. Success in attempt to marry her means
    sacred btmdle from Tirawa, and other blessings. Rich boy decides to marry her,
    goes north, and fasts. On fourth day red-painted man stands by him. This man,
    the Sun, gives him bow and arrow, and tells him that girl is daughter of
  middle: Evening- Star. Returning to his own village he starts out, accompanied by
    old man, to west. They encoimter and overcome difficulties — deep canyon, stream
    of water, thick timber, two bears, and two mountain-lions. In mean- time girl
    has been forced back toward her own lodge, and as boy strikes ground with his
    bow remaining animals become quiet, even great serpent. Girl, in defense of her
    action, accuses boy of desiring to know secrets of Tirawa. Entering lodge they
  end: find sacred bundle and four priests, representing winds, clouds, lightnings,
    and thunders. Boy is sent for baby-board and other accessories of cradle. In this
    task he is aided by mysterious being, presumably Morning-Star. The four old men
    now give bundle to girl, and send them forth as man and wife, men and animals
    in lodge returning into heavens and timber. Boy and girl return to his people
    and teach them to build earth-lodges, and explain symbolism of earth-lodge.
