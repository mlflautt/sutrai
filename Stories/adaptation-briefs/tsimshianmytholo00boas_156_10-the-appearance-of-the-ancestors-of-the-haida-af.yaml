narrative_arc:
  beginning: '(36) RAVEN STEALS SALMON EGGS (3 versions: M6 306; Mc 332; Ska 126)
    The people put a box of salmon eggs into the canoe. Raven pretends to be sick
    and is placed under a mat in the canoe. The people are asked to put the salmon
    eggs near him. After a while his mother smells the salmon eggs, and he answers
    her question, saying that it is a scab on his thigh that cause'
  middle: s the smell. He eats all the salmon eggs M6. In another Masset version his
    leg is injured. His sister launches her canoe and he crawls aboard. He asks his
    sister to put the salmon roe on his leg and to cover him. After a while the bilge-water
    becomes milky, and his sister smells the eggs. He pretends that it is matter from
    the wound; but when they land, it is foun
  end: d that he has eaten all the salmon roe. His sister puts the empty box on his
    head Mc. In the Skidegate version it is said that he pretends to be sick, lies
    down in the canoe by the side of the salmon roe; and when his sister smells it,
    he says that it is a scab which he has pulled off. He eats all the salmon roe,
    and throws his sister Siwa's's empty box ashore Ska.
