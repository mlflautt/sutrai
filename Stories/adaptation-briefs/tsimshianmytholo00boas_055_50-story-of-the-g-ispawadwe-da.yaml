  beginning: 50. Story of the G'ispawadwe'da^ Once, upon a time a man went out hunting
    mountain goats. He met a Black Bear, who carried him to his den. There the Bear
    taught him how to catch salmon and how to huild canoes. Two years later the man
    returned home. When he arrived, all the people were afraid of him, because he
    look
  middle: ed like a bear. One man, however, caught him and carried him to the house.
    He was unable to speak, and did not want to eat boiled meat. Then the people rubbed
    him with medicine, until finally he resumed his human form. After this, whenever
    he was in diiEculty, he went up the mountain to his friend the Bear, who wou
  end: ld help him. In winter, when nobody was able to obtain salmon, he would catch
    fresh salmon for him. Then the man built a house, and painted it with a picture
    of the Bear. His sister wore a dancing-apron with a representation of a bear.
    There- fore his sister's descendants use the bear as their crest up to this day.^
