  beginning: THIS IS THE FOURTH PORTION OF THE MABINOGI ATH the son of Mathonwy was
    lord over Gwynedd, and Pryderi the son of Pwyll was lord over the one-and-twenty
    Cantrevs of the South; and these were the seven Cantrevs of Dyved, and the seven
    Cantrevs of Morganwc, the four Cantrevs of Ceredigiawn, and the three of Ystrad
    Tywi. At that time, Math the son of Mathonwy could not exist unless his feet were
    in the lap of a maiden, except only when he was prevented by the tumult of war.
    Now the maiden who
  middle: was with him was Goewin, the daughter of Pebin of Dol Pebin, in Arvon, and
    she was the fairest maiden of her time who was known there. And Math dwelt always
    at Caer Dathyl, in Arvon, and was not able to go the circuit of the land, but
    Gil- vaethwy the son of Don, and Eneyd the son of Don, his nephews, the sons of
    his sister, with his household, went the circuit of the land in his stead. Now
    the maiden was with Math continually, and Gil- vaethyw the son of Don set his
    affections upon her,
  end: and loved her so that he knew not what he should do because of her, and therefrom
