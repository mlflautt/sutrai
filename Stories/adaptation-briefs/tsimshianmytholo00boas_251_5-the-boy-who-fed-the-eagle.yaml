  beginning: 5. The Boy who Fed the Eagle A chief's son, laxdze, used to go out with
    the other boys to fish. They make a dam and catch salmon. Then they string the
    fish on a rope, but they do not tie a knot at the end; tlierefore, when they drag
    the rope along, a salmon drops off. This annoys the chief. The Eagle picks up
    the salmon, and also takes those that he leaves in the river. The boy is as a
    brother to the Eagles, and gives tliem much food. Finally the father becomes so
    a
  middle: nnoyed that lie decides to desert him, and he leaves with all the people
    of the village. Only the grandmother of the boy remains; she hides a little fire
    for him in a clamshell. Then they build a fire of leaves. The Eagles watch them.
    In the morning the old woman nudges the boy and asks him to get up. Then he finds
    food on the beach, which is given to him by the Eagles. First he finds a hahbut,
    which they roast over the fire. The father sees the smoke from a distanc
  end: e, and wonders where it comes from. Tlie Eagles give them larger and larger
    food, seals and sea hons. After some time the father sends a canoe with two men
    to look after his son. They discover the food, and on returning tell the father
    that his son is wealthy. The father returns with his people; but when they arrive,
    the boy upsets their canoes. (After this follows the story how the father offered
    various girls to the young man, who finally accepted one whom he hked.)
