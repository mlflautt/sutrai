  beginning: 'SLAYING OF ORLAM " Let us fare forth now," quoth AihlL Thereafter they
    reached Mag Mucceda ('' the plain of the Swineherd.'') Cuchu- lain lopped off
    an oak that was before him in that place and set an ogam-writing on its side.
    This is what was on it : * That no one should pass by till a chariot-warrior with
    a chariot should overleap it.'' They pitch there their tents and proceed to leap
    over the oak in their chariots. Thereat thirty horses fall and thirty chariots
    are broken. Now, Belach And {'' the...'
  middle: e is not good in the water," said he. He doffs his clothes and goes into
    the water to meet him. " Come not before me," cried Cuchulain ; "it shall be thy
    death and it would grieve me to kill thee." " Nay, but I will go," answered Fraech,
    "so that we come together in the water, and it behoves thee to engage with me."
