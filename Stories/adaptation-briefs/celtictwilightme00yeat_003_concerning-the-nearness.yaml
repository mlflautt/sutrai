narrative_arc:
  beginning: CONCERNING THE NEARNESS TOGETHER OF HEAVEN, EARTH, AND PURGATORY. In
    Ireland this world and the other are not widely sundered ; sometimes, indeed,
    it seems almost as if our earthly chattels were no more than the shadows of things
    beyond. A lady I knew once saw a village child running about with a long trailing
    petticoat upon her, and asked the creature why she did
  middle: not have it cut short. ' It was my grandmother's,' said the child ; ' would
    you have her going about yonder with her petticoat up to her knees, and she dead
    but four days ? ' I 1 66 The Celtic Twilight. have read a story of a woman whose
    ghost haunted her people because they had made her grave-clothes so short that
    the fires of purgatory burned her knees. The pea
  end: santry expect to have beyond the grave houses much like their earthly homes,
    only there the thatch will never grow leaky, nor the white walls lose their lustre,
    nor shall the dairy be at any time empty of good milk and butter. But now and
    then a landlord or an agent or a gauger will go by begging his bread, to show
    how God divides the righteous from the unrighteous.
