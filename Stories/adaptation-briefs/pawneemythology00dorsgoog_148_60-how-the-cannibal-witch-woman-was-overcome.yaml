narrative_arc:
  beginning: 60. HOW THE CANNIBAL WITCH-WOMAN WAS OVERCOME. Boy goes to village, where
    he is invited by Eyes- Wide-Open, Coyote, to eat with Witch- Woman. He refuses
    to eat and she challenges him to contest. On morrow they dive into river, both
    remaining under water until afternoon. Old woman is victorious, boy is killed,
    and woman places his head with her other tro- phies. Dead boy's twin brother sets
    out to find him; arrives at village. On night before co
  middle: ntest he goes to river bank and cries. Beaver comes and takes boy into Beavers'
    lodge, and in council they decide to help him. They feed him with meat of young
    beaver's leg, which has been boiled, bone of which is thrown into water. Yoimg
    Beaver who thus lost his leg dives into water and returns with his leg intact.
    Beaver chief gives boy blue mud, with which he paints himself. On following day
    contest takes place. As boy dives he enters Beaver
  end: s' lodge, where again Beaver's leg is cut off. While meat is cooking boy sleeps,
    while Beaver watches bank to see if old woman has appeared. By night old woman
    thinks she must be victorious and appears on bank. Watcher informs Beavers, who
    awaken boy, who eats, and Beaver's leg is restored and boy appears above water
    victorious. Witch people are killed and trampled into ground, water being forced
    from old woman, and she becomes spring near river.
