narrative_arc:
  beginning: 95. THE WOMAN AND BUFFALO DANCE. Unmarried woman gives birth to child,
    and because people are angry at her they leave her behind when they go on hunt.
    Child cries, she tries in vain to stop it, starts west, and on hill finds buffalo
    bull, who blows smoke from his mouth and gives woman root with which to doctor
    child. He rolls on ground and robe appears, in which she is told to wrap child.
    Bull blows and calls th
  middle: ree other bulls. They blow their breath upon child. Buffalo cow comes. Child
    is placed by cow and sleeps. When it awakes it is well. Buffalo tell woman that
    root will drive away wild beasts and that she is to bathe child. She starts off,
    passes snake, and it dies on account of root. Man comes to her lodge and offers
    to be her husband. He learns of her power and they return west to thank buffalo,
    and he is taught
  end: buffalo dance. He finds rattle where buffalo rolls upon ground, which bears
    picture of buffalo skull. He is to use it in doctoring. Buffalo rolls again and
    makes whistle, from each end of which hangs moon-shaped shell. la doctoring, man
    is to blow whistle, whereupon he will see bull's shadow. If shadow does not appear,
    patient is to die. When boy grows up he becomes great medicine-man and is taught
    buffalo dance.
