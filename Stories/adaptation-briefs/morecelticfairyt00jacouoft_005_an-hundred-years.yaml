    volume in 1891, the publication of such tales has gone on apace. Mr. Curtin has
    published in the New York Sun no less than fifty more Irish fairy tales, one of
    which he has been good enough to place at my disposal for the present volume.
    Mr. Larminiehas published with Mr. ...
  middle: ountry of J. F. Campbell. Taken altogether, some- thing like a hundred previously
    unpublished tales from Celtdom have been rendered accessible to the world since
    I last wrote, a by no means insignificant outcome in three years. It is at any
    rate clear, that the only considerable addition to our folk-lore knowledge in
    these isles must come from the Gaelic area. The time of harvest can be but short
    ; may the workers be many, willing, and capable. XXVII. THE FATE OF THE CHILDREN
