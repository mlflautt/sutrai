narrative_arc:
  beginning: 20. SPOTTED-HORSE, A BRAVE AND A CHIEF. Man in dream sees mysterious
    being with painted buffalo robe, lariat, and bundle, and is told to stand on hill
    for four days, whereupon he will receive power. Obeying his instructions, he finds
    sun glass and blue stone, which he makes into pipe, the stem of which he does
    not perforate. Next he finds wild-cat, which he skins
  middle: to become part of sacred bundle which he has been directed to make. Having
    assembled the parts of his btmdle, he lights his pipe with glass, and smoke passes
    through stem, though it is not perforated. He is importuned by his friends to
    take pity on them and allow them to join him on Var-path. He consents, saying
    that his protector is the Sun. In journeying he al
  end: ways passes on east side of his compan- ions. He becomes warrior and is successful
    in taking ponies. He becomes chief. The bundle and accompanying rites are transmitted
    to young man, who changes his name with each fresh success on war-path. As Spotted-Horse-Chief
    he leads party against Sioux, success being attributed to rite he performs in
    connection with bundle.
