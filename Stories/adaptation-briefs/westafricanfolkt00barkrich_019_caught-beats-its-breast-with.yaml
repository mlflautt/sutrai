narrative_arc:
  beginning: CAUGHT BEATS ITS BREAST WITH ITS FORE-LEGS 'ANY centuries ago, the people
    of this earth were much troubled by floods. The sea used at times to overflow
    its usual bound- aries and sweep across the low, sandy stretches of land which
    bordered it. Time and again this hap- pened, many lives being lost at each flood.
    Mankind was very troubled to find an escape from this oft- repeated disaster.
    He could think of no way of avoiding it. Fortunately for him the wise turtle c
  middle: ame to his help. " Take my advice," said she, " and plant rows of palms
    along the sea-coast. They will bind the sand together and keep it from being washed
    so easily away." He did so, with great success. The roots of the palms kept the
    sand firmly in its place. W^hen the time came again for the sea to overflow, it
    washed just to the line of trees and came no farther. 87 WEST AFRICAN FOLK-TALES
    Thus many lives were saved annually by the kind forethought of the turtl
  end: e. In return — one would think — mankind would pro- tect and cherish this poor
    animal. But no ! Each time a turtle comes to the seashore to lay her eggs among
    the sand, she is caught and killed for the sake of her flesh. It is the thought
    of the ingratitude of mankind to her, which makes her beat her breast with her
    fore-legs when she is caught. She seems to be saying, " Ah ! this is all the return
    I get for my kindness to you." 88 XVI . HOW BEASTS AND SERPENTS FIRST
