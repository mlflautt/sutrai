  beginning: 2. The Raccoon. They meet a raccoon holding wood in its mouth. Little
    Feather kills it. They reach the house of an old woman, who feeds them. She asks
    for her granddaughter, who has gone to get chips for the fire. The brothers tell
    that they killed a raccoon. The old woman says that is her granddaughter, and
    tells the door and smoke hole
  middle: of the house to close. She intends to kill them by heat. Little Feather
    flies out as bird down, swings the plume over Young Raccoon, helps her gather
    wood, and they return. Then the old woman opens the house and lets them go Ts
    127. [Little Feather sees a raccoon, tears it, and throws it away. They reach
    the house of an old woman, who a
  end: sks, "Did you see my child?" They say they saw only a raccoon. The woman says
