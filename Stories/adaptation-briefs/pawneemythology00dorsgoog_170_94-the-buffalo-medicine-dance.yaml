narrative_arc:
  beginning: 94. THE BUFFALO MEDICINE DANCE. People are on buffalo hunt and are attacked
    by bull, who enters sacred tipi and tears it to pieces. Man is sent for who understands
    spirits of buffalo. In after- noon dark clouds gather, rainstorm follows, and
    woman is blown away. After storm, people are addressed by buffalo, who tells them
    that their sacred belongings shall be restored. Buffa
  middle: lo disappears. Again buffalo appears and invites some of buffalo medicine-men
    to go with him to buffalo country. They travel until they come to steep bank,
    where they enter buffalo lodge, passing on way through deep water. In lodge they
    find bear and buffalo, who perform feats of sleight-of-hand. During performance
    animals arise, snort, and downy feathers fall from their mou
  end: ths. One buffalo blows upon reed whistle and swallows it, throwing up feathers.
    He tells medicine-men that he gives them ceremony, that they shall have buffalo
    skull to which they shall make offerings, for spirit of buffalo will reside in
    skull, and that skull will inform them through dreams as to what they shall do
    in ceremony. People return to village and perform ceremony.
