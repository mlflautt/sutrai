narrative_arc:
  beginning: (1) He meets Blind Geese ' (Ts 1, Ts 4, Mo, Hai 6) who are digging roots,
    which he takes away. Then they quarrel, thinking that the others had taken them
    Ts 4, Hai 6. [They are eating roots of a Seaweed, and smell him Ts 4; they are
    singing Ts 1 ; they were women Hai 6; he meets women digging clover roots, who
    say they smell him Sk6; he meets old women, one of whom distributes food bciled
    in kettle; he takes away dishes, and they smell the stranger Na 5.] [In Ma h
  middle: e meets Heron first, who warns him against the Blind Geese; he is to give
    them tc.'al; he approaches from behind; they smell him.] They call him by name,
    and this is the first time his name is known Ma, Sk5, Hai 6. He opens their eyes,
    and in return they promise their help Ts 1, Sk6, Na 5 [he rubs their eyes with
    a root; they are able to see, and cry, "Our eyes are open!" therefore they cry
    that way up to this day; he gives them tobacco, therefore geese are brown
  end: under the bill Ts 4]. [In Ma the Geese appear as watchmen of the Killer Whales,
    and promise not to shout. The same idea occurs in Se, where the Geese grandmothers
    shout when he comes. In all the other cases the Geese warn him, telling him about
    later dangers. The Geese warn him against the Clam, Codfish, and Halibut, and
    promise to help him Ts 4. In Sk6 they tell him that GitgidA'mtclex, the son of
    Isne'gal, married the woman. In Na 5 they tell him about the Crane.]
