    and said: "To you four gods in the west I give my tongue and my heart and the
    best parts of my body if you will send me a little rain. " At once clouds formed
    in the west and a r'
  middle: 'ainstorm came. The rain began to fall and pools of water soon formed over
    the prairie. Coyote then drank and felt refreshed. It still continued to rain.
    Then Coyote said: '' '' You gods in the heavens, I did not ask you for so much
    rain. What shall I do if I give to you my heart and tongue and other parts of
    my body? I cannot get more and I need these things in my body. I will not give
    them to you. I take back all'
  end: 'that I promised you. " New clouds came from the west and it began to lighten
