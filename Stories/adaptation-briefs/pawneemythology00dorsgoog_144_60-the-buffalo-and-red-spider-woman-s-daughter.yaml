  beginning: 60. THE BUFFALO AND RED-SPIDER-WOMAN'S DAUGHTER. Red-Spider-Woman, living
    in center of earth, controls com, beans, etc., and has many daughters. Buffalo
    live in north, their chief having son named Curly-Eyes. Buffalo in council decide
    to send four of their number to south to look for better land, Curly-Eyes being
    one of party. On their journey they meet Red-Spi
  middle: der- Woman and her daughters, Curly-Eyes falling in love with one of them.
    Reporting fact to his father, he is told it will be necessary to buy her in order
    that he may bring her home. Then delegations are sent offering old woman, first,
    valley full of buffalo* then two valleys full, then half land full, and finally
    land full. Still old woman refuses, whereupon
  end: buffalo decide to move to her country. They travel south many years. Curly-Eyes
    and other buffalo see girl. Old woman's fields are trampled. She stands on prairie
    and begins to disappear in ground. They kill her. Buffalo chief announces that
    her body shall remain in grotmd as medicinal root, from which is derived squash
    medicine. Hereafter buffalo cover earth.
