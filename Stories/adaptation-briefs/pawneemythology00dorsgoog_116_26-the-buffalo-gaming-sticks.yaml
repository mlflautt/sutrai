source: pawneemythology00dorsgoog
culture: Native American
story_type: legend
narrative_arc:
  beginning: 26. THE BUFFALO GAMING-STICKS. Ring and javelin buffalo game is given
    to people, and they play, singing songs. Morning after first game they see tracks
    on gaming field. One young man who went into field lies with woman. She gives
    birth to buffalo calf. Later, party hunting sees snowbird. It flies in front of
    them, leading them on, for they can not kill it.
  middle: One by one they all cease to follow bird, except yoimg man who had associated
    with woman. On summit of ridge he is able to see countless buffalo approaching.
    In the field is woman and her child, as cow and calf — ^his wife and child. Calf
    is always crying for its father and overhears bulls declare they will kill him.
    Calf tells his father how he may recog
  end: nize him when bulls make him undergo certain tests. Calves are arranged in
    row and father is asked to recog- nize his son. He does so as calf winks at him.
    Next he distinguishes wife, for calf has placed burr on her tail. Man is permitted
    by bulls to return home, where he tells his people that in four days buffalo will
    come and theywill have plenty to eat.
