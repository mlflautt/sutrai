narrative_arc:
  beginning: 50. THE BOY WHO TURNED INTO A PRAIRIE DOG. A village lies between hill
    and creek, across which is Prairie Dog town. Bright Eyes, good-looking little
    boy in love with girl, repeatedly waits for her at spring. She tells him she does
    not love him. Grieving, boy sets out alone to east and crosses river and enters
    Prairie Dog town, where he marries young Prairie Dog and lives with them. His
    mother grieves for him and tracks him by his tears and footprints. She remai
  middle: ns there several days mourning. In vision is addressed by beautiful young
    girl and told that her son is happy; that he has forgotten about his people, except
    his mother. She is directed to bring to hole certain black arrow from boy's quiver.
    She does so, and as Prairie Dog leaves hole he jumps at arrow and becomes her
    son again. Boy returns home, followed by his Prairie Dog wife, who is pregnant.
    She rolls her- self in dust and becomes woman. They live together
  end: happily and have many chil- dren. He becomes great man, but is warned by his
    Prairie Dog wife that he shall never associate with girl through grief for whom
    he had left his village. This girl meets him, talks with him, says she is sorry
    she acted as she did, and they lie together. On returning home he finds wife and
    child, who do not heed his in- structions, but cross stream and turn into Prairie
    Dogs. From that time on boy has bad luck and dies broken-hearted.
