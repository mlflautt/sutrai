narrative_arc:
  beginning: 108. THE EAGLE AND THE SUN-DANCE. Poor young man goes on hill, cries,
    and he hears drumming on fourth night plainly. Visiting river where drumming is
    heard, he hears whistling. Looking overhead, he sees Eagle, who speaks to him.
    Eagle flies around boy, then off to tim
  middle: ber. He returns, and boy follows him until he finds birds sitting in circle,
    two swans in center drumming, and birds are all whistling. Eagle tells him they
    are to give him their dance. He is to dance four days, during which time he must
    fast. Swans tell him that they
  end: are leaders of dance and that their spirits will follow him home; that he will
    dream of dance and in dream will be instructed. He is to give dance when buffalo
    bones are seen on high hills. Owls circle about him and teach him songs. Thereafter,
    he institutes Sun-Dance.
