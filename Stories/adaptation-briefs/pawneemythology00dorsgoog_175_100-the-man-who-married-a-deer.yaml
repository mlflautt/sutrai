narrative_arc:
  beginning: 100. THE MAN WHO MARRIED A DEER, Young man on htmt goes to Pahuk, where
    he associates with woman who turns into deer. Angry because he has been deceived,
    he shoots at deer several times, but can not kill it. He follows deer to swamp,
    where it becomes woman. They lie together, and both become deer and wander over
    country, and woman gives birth to two fawns. In meantime she teaches him deer
    power. He is now able to transform himself into d
  middle: eer or back into man at his will. She takes him to his people and he enters
    medicine-lodge and asks permission to perform. When they give it he returns to
    his wife, and she and two fawns turn into human beings. They enter village, but
    odor of people is offensive. Man and his wife and child enter medicine-lodge.
    They borrow pair of deer antlers, sing, man places antlers on his head and he
    becomes deer. Next, he puts fawn skin over his boy
  end: and boy turns into fawn. Then he turns fawn into boy. At end of performance
    medicine-men acknowledge his great power and make him their leader. They live
    with people many years. Woman tells her husband that she must now leave him. She
    becomes black-tailed deer and nms off. Man is imhappy. His children grow up and
    both marry, his boy possess- ing great power. When man sees that his children
    are happy, he goes into timber and never returns.
