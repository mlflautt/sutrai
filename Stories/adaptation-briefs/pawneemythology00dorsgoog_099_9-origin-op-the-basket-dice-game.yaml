narrative_arc:
  beginning: 9. ORIGIN OP THE BASKET DICE GAME. At beginning, gods make mud images
    of girl and boy. They come to life, and bow and arrows are given them. To determine
    duration of life, and whether it should be night or day, animals pass by, and
    as they kill spotted one, day and night intervene.
  middle: Man hears dancing. Accompanied by his wife, he approaches lodge and they
    are invited by woman, the Moon, to enter. Within, they see four old men and many
    girls, daughters of Moon. Yotmg man learns dances and receives seeds, and they
    are taught dice game. Woman dancing in west is E
  end: vening-Star, standing before four old men. In lodge are four other dancers,
    daughters of Big- Black-Meteoric Star. The two learn many things, especially s3rmbolism
    of basket game, basket representing Moon, mother of all stars, who also helps
    Big-Black- Meteoric-Star to cure people.
