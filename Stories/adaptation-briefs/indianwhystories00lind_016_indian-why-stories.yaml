  middle: '# OLZ)-MAN AND HIS CONSCIENCE OLD-MAN AND HIS CONSCIENCE NOT so many miles
    away from the village, the great mountain range so divides the streams that are
    born there, that their waters are offered as tribute to the Atlantic, Pacific,
    and Arctic Oceans. In this wonder- ful range the Indians believe the winds are
    made, and that they battle for supremacy over Gunsight Pass. I have heard an old
    story, too,'
  end: that is said to have been generally believed by the Blackfeet, in which a monster
    bull-elk that lives in Gunsight Pass lords it over the winds. This elk creates
    the North wind by "flapping" one of his ears, and the South wind by the same use
    of his other. I am inclined to believe that the winds are made in that Pass, myself,
    for there they are seldom at rest, especially at this season of the year. 105
