narrative_arc:
  beginning: 68. THE WITCH-WOMAN WHO STOLE THE WONDERFUL BUFFALO ROBE. In village
    lives Witch-Woman who kills many people and is great thief. She also has power
    to turn people into animals. People try to kill her, and poimd her with sticks,
    cut her with knives, but in vain. They appeal to priest, and he sings songs which
    foretell of the death of old woman. In spring stranger
  middle: visits them wearing robe painted with stars, clouds, lightning, sun, moon,
    swallows, and flies. He is challenged by deer who belongs to old woman to race.
    Boy is victorious. Boy one day is gambling. False alarm of enemy is given. In
    confusion woman steals his robe. She taimts him and tells him he will never find
    it again. She is wearing it as skirt. Boy sings fou
  end: r times. Old woman recognizes his power, gives up robe, and she is taken up
    to heavens in rainstorm, and is thrown back into mud ravine and begins to urinate,
    and henceforth is spring. Boy says that thereafter she would either be spider
    or black- tailed deer, that his work is done, that he represents North Wind. And
    he becomes speckled snowbird and flies to north.
