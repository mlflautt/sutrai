title: 99. THE  BUFFALO  MEDICINE  WAR  SHIELD.
source: pawneemythology00dorsgoog
culture: Native American
story_type: hero_tale
narrative_arc:
  beginning: 99. THE BUFFALO MEDICINE WAR SHIELD. Man on hill is envious, seeing that
    boy is talking with girls, for girls have refused to talk with him. He cries on
    second hill farther away from village, and then wanders off and remains all winter.
    He returns in spring and does not enter village, for he has no home. He sets out
    after herd of buffalo, seeing among them woman. He asks her to marry him. He goes
    with her to buffalo village and woman's uncle tells him that he wants presents
    of scalp
  middle: and blue beads. Boy rettuns to his village, enters chief's tipi, obtains
    presents, and offers them to buffalo. They are thankful and give boy shield, which
    he is to wear upon his left shoulder. Boy returns with his wife to his village.
    It is attacked by enemy. He uses his shield in battle and kills many. He shows
    greater bravery in second and third attacks upon village. On fourth attack in
    his excitement he wears his shield on his right shoulder. He is wotmded and taken
    home to die
  end: . In night buffalo bull makes water in front of his tipi. In morning boy rubs
    some of mud over his face and returns and lies down, whereupon many buffalo roll
    about in his tipi. Great dtist appears. Boy rolls in dust again and becomes man
    with buffalo robe on his shoulder. He is known there- after as wonderful man.
    Buffalo warn him never to put buffalo horn or hoof in fire. Long time after, careless
    person, not knowing of restriction, throws spoon into fire in his tipi and man
    dies.
