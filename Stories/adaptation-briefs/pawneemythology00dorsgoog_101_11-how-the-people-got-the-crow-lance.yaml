  beginning: 11. HOW THE PEOPLE GOT THE CROW LANCE. Leader of war party announces
    necessity of sacrifice of raccoon. Raccoon is taken and sacrificed by fire. Some,
    protesting against this form of sacrifice and fearing bad luck, return home; others
    continue on war-path. Man who made sacrifice while out as scout is seen by remaining
    warriors to be attacked and overcome by warriors, who are Crows and Coyotes. Recognizing
    evil omen
  middle: ', they also return home. Man who had been killed that night is restored
    to life, and sees people dancing who are painted black and carry black lance.
    In morning he desires to follow some deer, and then some antelopes, but is restrained
    by Crows. Next day he kills fawn, on which he makes his meal. That night he hears
    strange noises from mound, but is restrained from going to place by Crows. He
    is re- 478 THE pawnee:'
  end: mythology. strained fotirth time. But fifth time Crows disappear in tree under
    which man had been lying, and just then hill appears into which man is invited,
    where he finds himself in cave in which Crows dance and make him member of the
    Crow Lance society. He is taught songs and ritual. Man had been scared simply
    by Coyotet and Crows. Coyotes wanted to eat him up, but Crows preferred to give
    him their ceremonies.
