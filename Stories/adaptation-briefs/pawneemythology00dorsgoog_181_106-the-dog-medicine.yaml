culture: Native American
story_type: legend
narrative_arc:
  beginning: 106. THE DOG MEDICINE. Boy resting on hill is spoken to by dog, who tells
    him he has taken pity on him and will help him to marry certain girl who has refused
    him. Boy goes south and sings song which Dog has taught him, and girl comes to
    him and they are married. They go to Dog, who tells boy that he is to call him
    brother. Dog gives him buffalo robe, eagle fan,
  middle: bone whistle, and rattle. Whistle he is to use in his ceremony and whenever
    he wants Dog. Dog gives him medicines and Dog dance, and tells him he should capture
    pony he is to give him when he is upon war- path. He will know it by star upon
    its forehead. Pony is to be Dog himself. Dog has power to blow smoke from its
    mouth. Boy originates war party; they go south,
  end: capture ponies, one of which has star on its forehead. In medicine dance boy
    appears with feathers on his head. When he dances he seems to be surrounded by
    sparks of fire. In doctoring sick man he sings songs and spits up small dog hide
    with picture of moon upon it. Patient is put to sleep upon this and becomes well.
    He institutes Yoimg Dog dance. ABSTRACTS. $35
