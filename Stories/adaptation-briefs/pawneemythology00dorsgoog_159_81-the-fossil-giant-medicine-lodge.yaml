narrative_arc:
  beginning: 81. THE FOSSIL GIANT MEDICINE-LODGE. Man from himting party near Swimming
    Mound enters timber and falls asleep on high hill. He is addressed by giant, who
    tells him that many of giant people were drowned in that place, and that their
    bones are thereabouts, and that upon south side of hill he will find one of his
    thigh bones; th
  middle: at he is to take it and it will give him great power. On waking, man sees
    no one, but goes and finds bone. Carved on it is man and woman, skull, bow and
    arrows, and many stars. On head is carved sun and moon. He takes it home and makes
    it into bundle. Again he dreams of this giant, and it tells him how to hold ceremony,
    and in
  end: his dream he hears songs which he is to sing in ceremony. Years after, he holds
    ceremony, and those associating with him in ceremony are known as Medicine-Stone
    people. This man becomes great medicine-man, and in doctoring uses dust from bone.
    In great smallpox epidemic those who touch bone are immime. Ceremony no longer
    exists.
