    camped, and Giant spoke kindly to her, like a brother to his sister. Her name
    was Tsowatz. She was the Oil Woman, of dark complexion. Giant asked her, "Tell
    me, how shall I cook my olachen?" Oil Woman told him, "You must heat stones; and
    when they are red-hot, pour four pails of water into a large cedar box. " Thus
