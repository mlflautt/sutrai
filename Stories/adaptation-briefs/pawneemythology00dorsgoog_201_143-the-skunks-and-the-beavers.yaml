narrative_arc:
  beginning: 143. THE SKUNKS AND THE BEAVERS. Skunks become himgry and plan to secure
    food by strategy. They send old woman to Beavers' lodge, asking them to send medicine-man
    to doctor yoimg Skunk. Beavers send White Beaver, who enters Sktmks' lodge. In
    attempting to draw pain from pretending sick Skunk with his mouth, he is told
    that pain is in rectum, whereupon he
  middle: receives discharge, rolls over, and is killed by older Skunks. Thus they
    obtain food. Next day they resort to same plan, sending old woman to Beavers for
    medicine-man. She tells them that man who was sent day before was so ashamed of
    his incompetence that he wandered off. They send another medicine- man, who is
    killed in same manner. Thus one after anothe
  end: r of Beavers is killed by Skunks, until there is only one left. This Beaver
    becoming lonely, goes to creek and cries. Diving bird takes him into water, where
    he finds lodge of Beavers which have been killed. Since then Beavers live in water
    and are at enmity with Skunks. People are careful to throw beaver bones into water
    that they may again become beavers.
