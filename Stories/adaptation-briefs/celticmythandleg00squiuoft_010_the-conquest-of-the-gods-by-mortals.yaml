narrative_arc:
  beginning: THE CONQUEST OF THE GODS BY MORTALS Of what Badb had in mind when she
    uttered this prophecy we have no record. But it was true. The twilight of the
    Irish gods was at hand. A new race was coming across the sea to dispute the ownership
    of Ireland with the people of the goddess Danu. And these new-comers were not
    divinities like themselves, but men like ourselves, ancestors of the Gaels. This
    story of the conquest of the gods by mortals — which seems such a strange one
    to us — is typi cally Celtic....
