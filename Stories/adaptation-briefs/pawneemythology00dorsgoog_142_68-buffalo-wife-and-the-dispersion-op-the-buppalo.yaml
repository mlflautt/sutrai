    man learns that in that village is girl who dislikes men. He decides to marry
    her. She also hears of him. Each decides to visit the other, and they meet on
    high hill between villages. They compare notes and each retume home. Girl by river
    bank s
  middle: ings of her lover. Coyote hears her and schemes how to get her. Coyote pricks
    his horse with cockle burrs and rides to giri, but boy has arrived first and takes
    girl to his tipi, where she is fed and they go to girl's fotfaer, who is glad,
    and sends for Buffalo and they are given smoke. Buffalo chief deddee to send eight
    of Buffalo to people to be killed. Their meat is made holy, and Buffido c
  end: hief is pleased and sends more of his people. Each day a larger number is sent.
    and finally Buffalo scatter for benefit of people. As Buffalo wife wore an elk
    dress, so must woman in ceremonies when her husband makes Buffalo holy. Thus also
    they wear eagle feather on their heads, imitating her. She finally makes her husband
    angry and he flies away as blackbird and thereafter lives among buflblo.
